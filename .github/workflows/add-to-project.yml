name: Auto Add to Project

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add Issue or PR to Project
        uses: actions/add-to-project@v2
        with:
          # URL of the GitHub Project (v2)
          project-url: 'https://github.com/orgs/Gergo-Hunor-Gergo-vizsgaremek-csoport/projects/3'
          # PAT with 'project' permissions stored in repository secrets
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}